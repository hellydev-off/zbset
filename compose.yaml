services:
  postgres:
    image: postgres:18
    restart: always
    
    volumes:
      - postgres_data:/var/lib/postgresql

    environment: 
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
      POSTGRES_USER: ${DB_USER}
    ports:
     - "5432:5432"

volumes:
  postgres_data: {}