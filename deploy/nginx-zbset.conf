server {
    listen 80;
    server_name 188.120.247.56;

    client_max_body_size 25m;

    # то же самое, что делает dev-прокси в vite.config.js: браузер не умеет
    # слать body на GET, а /api/message/getChatMessages требует chat_id
    # именно в body (не в query). В деве это обходит Vite-мидлварь, в проде
    # статику отдаёт голый nginx — без этого блока запрос улетал бы в SPA
    # fallback и возвращал бы index.html вместо истории сообщений.
    location = /dev-proxy/get-chat-messages {
        proxy_pass http://127.0.0.1:3001/api/message/getChatMessages;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type "application/json";
        proxy_set_body '{"chat_id":$arg_chat_id}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:3001/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        # без завершающего слэша в proxy_pass — путь НЕ обрезается,
        # т.к. Django (config/urls.py) сам монтирует accounts.urls под /auth/
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
