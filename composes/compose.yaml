services:
  core-service:
    build:
      context: ../services/core-service
      dockerfile: Dockerfile

    container_name: zbset-core-service

    command: >
      uv run gunicorn
      config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 60

    volumes:
      - ../services/core-service:/app
      - core_service_venv:/app/.venv
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - ../.env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  messaging-service:
    build:
      context: ../services/messaging-service-express
      dockerfile: Dockerfile

    container_name: zbset-messaging-service

    volumes:
      - messaging_storage:/app/storage

    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/messaging
      JWT_SECRET: ${MESSAGING_JWT_SECRET:-supersecretkey}
      JWT_EXPIRES: "24h"
      NODE_ENV: production
      LOG_LEVEL: info

    ports:
      - "127.0.0.1:3001:3000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  messaging-frontend:
    build:
      context: ../services/messaging-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_ORIGIN}/api
        VITE_SOCKET_URL: ${PUBLIC_ORIGIN}

    container_name: zbset-messaging-frontend

    ports:
      - "127.0.0.1:3002:80"

    depends_on:
      - messaging-service

    restart: unless-stopped

  postgres:
    image: postgres:18

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data:
  core_service_venv:
  static_volume:
  media_volume:
  messaging_storage:
