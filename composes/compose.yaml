services:
  core-service:
    build:
      context: ../services/core-service
      dockerfile: Dockerfile

    container_name: zbset-core-service

    command: >
      uv run gunicorn
      config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 60

    volumes:
      - ../services/core-service:/app
      - core_service_venv:/app/.venv
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    expose:
      - "8000"

    env_file:
      - ../.env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:18

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data:
  core_service_venv:
  static_volume:
  media_volume: